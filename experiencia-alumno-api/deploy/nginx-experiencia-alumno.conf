# Nginx en el puerto 80:
#   /          -> frontend React (carpeta dist copiada a /var/www/experiencia-alumno)
#   /api/      -> backend Spring Boot en localhost:8080 (proxy inverso)
#   /swagger-ui y /v3/api-docs -> documentacion de la API
#
# Ventaja: frontend y API comparten la misma direccion (http://IP_PUBLICA),
# asi el navegador no necesita CORS y el frontend no depende de la IP.
#
# Instalar:
#   sudo cp deploy/nginx-experiencia-alumno.conf /etc/nginx/conf.d/experiencia-alumno.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    root /var/www/experiencia-alumno;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: cualquier ruta del frontend vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
