# Perfil prod: PostgreSQL en la misma instancia EC2 (por eso localhost).
# La contrasena NUNCA se escribe aqui: se entrega con la variable de entorno DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:experiencia_alumno}
spring.datasource.username=${DB_USER:experiencia_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.jpa.show-sql=false

# Detras de Nginx: respeta los headers X-Forwarded-* (Swagger genera bien la URL del servidor)
server.forward-headers-strategy=framework
