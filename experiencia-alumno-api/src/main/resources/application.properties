spring.application.name=experiencia-alumno-api
server.port=8080

# Perfil por defecto: dev (H2 en memoria, para trabajar en IntelliJ sin instalar nada).
# En AWS se ejecuta con SPRING_PROFILES_ACTIVE=prod (PostgreSQL).
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: la clave real se entrega por variable de entorno (JWT_SECRET) y debe tener 32 caracteres o mas.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-experiencia-alumno-2026-cambiar-en-prod}
# Access token: 15 minutos. Refresh token: 7 dias.
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Origenes permitidos para CORS (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Ignora campos extra en el JSON de entrada (ej: "id" al editar) en vez de responder 400
spring.jackson.deserialization.fail-on-unknown-properties=false

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
